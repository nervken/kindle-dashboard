<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kindle Weather & Live Google Calendar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    color: #000000;
    font-family: Arial, "Heiti TC", "Microsoft JhengHei", sans-serif;
    -webkit-text-size-adjust: none;
  }
  body {
    padding: 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .kindle-box {
    border: 4px solid #000000;
    padding: 8px;
    margin-bottom: 8px;
    width: 100%;
  }

  .time-large {
    font-size: 85px;
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: -3px;
  }

  table { width: 100%; border-collapse: collapse; }

  .data-table td {
    border: 2px solid #000000;
    padding: 10px 8px;
    font-size: 22px;
    font-weight: 900;
  }

  .forecast-table td {
    border-bottom: 3px solid #000000;
    padding: 10px 4px;
    font-size: 22px;
    font-weight: 900 !important;
  }

  /* 行程清單樣式優化 */
  .calendar-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .calendar-item {
    font-size: 21px;
    font-weight: 900;
    padding: 6px 0;
    border-bottom: 2px dashed #000000;
    word-break: break-all;
  }
  .calendar-item:last-child {
    border-bottom: none;
  }
</style>
</head>
<body>

  <!-- 1. 頂部頁眉：特大時間與地點 -->
  <div style="border-bottom: 5px solid #000000; padding-bottom: 8px; margin-bottom: 8px;">
    <table>
      <tr>
        <td style="vertical-align: bottom; width: 55%;">
          <div class="time-large" id="current-time">--:--</div>
          <div id="current-date" style="font-size: 25px; font-weight: 900; margin-top: 8px;">----年--月--日</div>
        </td>
        <td style="text-align: right; vertical-align: bottom; width: 45%;">
          <div style="border: 3px solid #000000; padding: 4px 8px; font-size: 22px; font-weight: 900; display: inline-block; margin-bottom: 6px;">
            [地點] <span id="location-name">英國 Denton</span>
          </div>
          <div>
            <span id="header-temp" style="font-size: 45px; font-weight: 900;">--°C</span>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <!-- 2. 今日天氣實況 -->
  <div class="kindle-box">
    <div style="font-size: 24px; font-weight: 900; border-bottom: 3px solid #000000; padding-bottom: 5px; margin-bottom: 8px;">
      今日天氣實況
    </div>
    
    <table style="margin-bottom: 8px;">
      <tr>
        <td style="font-size: 65px; font-weight: 900; width: 35%;" id="main-temp">--°C</td>
        <td style="text-align: right; font-size: 22px; font-weight: 900; width: 65%; line-height: 1.3;">
          <div id="main-condition-text" style="font-size: 26px; font-weight: 900; margin-bottom: 4px;">載入中...</div>
          <div>最高: <span id="temp-max">--</span> / 最低: <span id="temp-min">--</span></div>
          <div>體感溫度: <span id="apparent-temp">--</span></div>
        </td>
      </tr>
    </table>

    <table class="data-table">
      <tr>
        <td style="width: 50%;">降雨機率: <span id="rain-chance">--%</span></td>
        <td style="width: 50%;">相對濕度: <span id="humidity">--%</span></td>
      </tr>
      <tr>
        <td>風速: <span id="wind-speed">-- km/h</span></td>
        <td>預計日出: <span id="sun-time">--:--</span></td>
      </tr>
    </table>
  </div>

  <!-- 3. Google 日曆近期 真實行程區塊 -->
  <div class="kindle-box">
    <div style="font-size: 24px; font-weight: 900; border-bottom: 3px solid #000000; padding-bottom: 5px; margin-bottom: 8px;">
      📅 Google 日曆近期預約行程
    </div>
    <ul class="calendar-list" id="calendar-events-list">
      <li class="calendar-item" id="cal-status">正在同步連線 Google 伺服器...</li>
    </ul>
  </div>

  <!-- 4. 未來 7 天天氣預報 -->
  <div class="kindle-box" style="flex: 1;">
    <div style="font-size: 24px; font-weight: 900; border-bottom: 3px solid #000000; padding-bottom: 5px; margin-bottom: 8px;">
      未來 7 天天氣預報
    </div>
    <table class="forecast-table">
      <tbody id="forecast-body">
        <tr><td style="text-align:center; padding: 15px 0; font-size: 22px; font-weight: 900;" id="status-msg">正在更新天氣數據...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 5. 世界城市時間 -->
  <div class="kindle-box" style="margin-bottom: 0;">
    <div style="font-size: 20px; font-weight: 900; border-bottom: 2px solid #000000; margin-bottom: 5px; padding-bottom: 2px;">
      世界主要城市時間
    </div>
    <table style="text-align: center; font-size: 20px; font-weight: 900;">
      <tr style="font-size: 18px; color: #000;">
        <td style="width: 20%;">倫敦</td>
        <td style="width: 20%;">香港</td>
        <td style="width: 20%;">紐約</td>
        <td style="width: 20%;">東京</td>
        <td style="width: 20%;">雪梨</td>
      </tr>
      <tr style="font-size: 24px; font-weight: 900; height: 35px; vertical-align: middle;">
        <td id="clock-london">--:--</td>
        <td id="clock-hk">--:--</td>
        <td id="clock-ny">--:--</td>
        <td id="clock-tokyo">--:--</td>
        <td id="clock-sydney">--:--</td>
      </tr>
    </table>
  </div>

  <div style="font-size: 13px; font-weight: 900; margin-top: 4px; text-align: right;">
    最後更新時間: <span id="update-time">--:--</span>
  </div>

  <script>
    var lat = 53.456, lon = -2.115; // Denton, UK

    // ⚠️ 正式使用你提供的 Google Apps Script 官方中轉站網址
    var gasUrl = 'https://script.google.com/macros/s/AKfycbznwqGGC7sr-a6XSgsUdXye6V-qyBxcTbBMLESGS7YlTCwD1Kpmma-Y6wtWFbpQL9R_bg/exec';

    function padZero(num) { return num < 10 ? '0' + num : '' + num; }

    function parseTimeString(isoStr) {
      if (!isoStr) return '--:--';
      if (isoStr.indexOf('T') !== -1) {
        return isoStr.split('T')[1].substring(0, 5);
      }
      return isoStr;
    }

    function getTZDate(offsetHours) {
      var d = new Date();
      var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      return new Date(utc + (3600000 * offsetHours));
    }

    function calcTZTime(offsetHours) {
      var nd = getTZDate(offsetHours);
      return padZero(nd.getHours()) + ':' + padZero(nd.getMinutes());
    }

    function updateClock() {
      var londonDate = getTZDate(1);
      var h = padZero(londonDate.getHours());
      var m = padZero(londonDate.getMinutes());
      document.getElementById('current-time').innerText = h + ':' + m;

      var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('current-date').innerText = londonDate.getFullYear() + '年' + (londonDate.getMonth()+1) + '月' + londonDate.getDate() + '日 ' + days[londonDate.getDay()];

      document.getElementById('clock-london').innerText = h + ':' + m;
      document.getElementById('clock-hk').innerText = calcTZTime(8);
      document.getElementById('clock-ny').innerText = calcTZTime(-4);
      document.getElementById('clock-tokyo').innerText = calcTZTime(9);
      document.getElementById('clock-sydney').innerText = calcTZTime(10);
    }

    // 直接向 Google 官方 Apps Script 發送請求，100% 成功連線
    function fetchAllCalendars() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', gasUrl, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            var evs = parseICSData(xhr.responseText);
            renderCalendarEvents(evs);
          } else {
            // GAS 部署設定錯誤 (忘記選「所有人」) 或 Google 伺服器問題
            document.getElementById('calendar-events-list').innerHTML = '<li class="calendar-item">• 讀取日曆數據失敗 (請檢查 GAS 部署設定)</li>';
          }
        }
      };
      xhr.send();
    }

    // 優化 ICS 解析邏輯，彻底解決換行與標題解析問題
    function parseICSData(icsData) {
      if (!icsData) return [];
      
      // 解開 iCal 格式的跨行摺疊 (Unfold lines)
      var unfoldedData = icsData.replace(/\r\n\s/g, '').replace(/\n\s/g, '');
      var lines = unfoldedData.split(/\r\n|\n|\r/);
      
      var events = [];
      var currentEvent = null;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf('BEGIN:VEVENT') === 0) {
          currentEvent = {};
        } else if (line.indexOf('END:VEVENT') === 0) {
          if (currentEvent && currentEvent.summary) {
            events.push(currentEvent);
          }
          currentEvent = null;
        } else if (currentEvent) {
          if (line.indexOf('SUMMARY:') === 0) {
            currentEvent.summary = line.substring(8);
          } else if (line.indexOf('SUMMARY;') === 0) {
            var sParts = line.split(':');
            currentEvent.summary = sParts.slice(1).join(':');
          } else if (line.indexOf('DTSTART') === 0) {
            var parts = line.split(':');
            currentEvent.start = parts[parts.length - 1];
          }
        }
      }
      return events;
    }

    // 修復日曆過濾與顯示邏輯：強制顯示未來 7 天內的所有全天行程！
    function renderCalendarEvents(events) {
      var londonDate = getTZDate(1);
      var todayYYYYMMDD = parseInt(londonDate.getFullYear() + padZero(londonDate.getMonth() + 1) + padZero(londonDate.getDate()), 10);

      var validEvents = [];
      for (var i = 0; i < events.length; i++) {
        var ev = events[i];
        if (ev.start && ev.start.length >= 8) {
          var evDateNum = parseInt(ev.start.substring(0, 8), 10);
          // 保留今天或未來所有的行程
          if (evDateNum >= todayYYYYMMDD - 1) { // 放寬 1 天寬限期
            validEvents.push(ev);
          }
        } else {
          validEvents.push(ev);
        }
      }

      // 按時間序排序
      validEvents.sort(function(a, b) {
        return (a.start || '').localeCompare(b.start || '');
      });

      var html = '';
      if (validEvents.length === 0) {
        html = '<li class="calendar-item">• 目前沒有預約行程</li>';
      } else {
        // 最多顯示 6 個最接近的行程 (確保 12號, 13號, 14號等會依次列出)
        for (var e = 0; e < validEvents.length && e < 6; e++) {
          var ev = validEvents[e];
          var dateStr = '';
          if (ev.start && ev.start.length >= 8) {
            var m = parseInt(ev.start.substring(4, 6), 10);
            var d = parseInt(ev.start.substring(6, 8), 10);
            dateStr = m + '/' + d + ' ';
            if (ev.start.indexOf('T') !== -1 && ev.start.length >= 13) {
              dateStr += ev.start.substring(9, 11) + ':' + ev.start.substring(11, 13) + ' ';
            } else {
              dateStr += '(全天) ';
            }
          }
          html += '<li class="calendar-item">• ' + dateStr + ev.summary + '</li>';
        }
      }
      document.getElementById('calendar-events-list').innerHTML = html;
    }

    function getWeatherText(code) {
      if (code === 0) return '[晴] 陽光普照';
      if (code === 1) return '[晴] 大致天晴';
      if (code === 2) return '[雲] 晴間多雲';
      if (code === 3) return '[雲] 密雲有陰';
      if (code === 45 || code === 48) return '[霧] 局地有霧';
      if (code >= 51 && code <= 55) return '[雨] 輕微毛毛雨';
      if (code >= 61 && code <= 63) return '[雨] 局部有陣雨';
      if (code === 65) return '[雨] 中至大陣雨';
      if (code >= 71 && code <= 77) return '[雪] 飘雪或積雪';
      if (code >= 80 && code <= 82) return '[雨] 短暫局部雨';
      if (code >= 95) return '[雷] 雷暴及陣雨';
      return '[陰] 多雲有陰';
    }

    function fetchWeather() {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max&timezone=auto';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            renderWeather(data);
          } catch(e) {
            document.getElementById('status-msg').innerText = '解析天氣數據失敗';
          }
        }
      };
      xhr.send();
    }

    function renderWeather(data) {
      var cur = data.current;
      var daily = data.daily;

      document.getElementById('header-temp').innerText = Math.round(cur.temperature_2m) + '°C';
      document.getElementById('main-temp').innerText = Math.round(cur.temperature_2m) + '°C';
      
      var condText = getWeatherText(cur.weather_code);
      document.getElementById('main-condition-text').innerText = condText;

      document.getElementById('temp-max').innerText = Math.round(daily.temperature_2m_max[0]) + '°C';
      document.getElementById('temp-min').innerText = Math.round(daily.temperature_2m_min[0]) + '°C';
      document.getElementById('apparent-temp').innerText = Math.round(cur.apparent_temperature) + '°C';

      document.getElementById('rain-chance').innerText = (daily.precipitation_probability_max[0] || 0) + '%';
      document.getElementById('humidity').innerText = cur.relative_humidity_2m + '%';
      document.getElementById('wind-speed').innerText = Math.round(cur.wind_speed_10m) + 'km/h';

      if (daily.sunrise && daily.sunrise[0]) {
        document.getElementById('sun-time').innerText = parseTimeString(daily.sunrise[0]);
      }

      var html = '';
      var daysMap = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      for (var d = 0; d < 7 && d < daily.time.length; d++) {
        var dateParts = daily.time[d].split('-');
        var year = parseInt(dateParts[0], 10);
        var month = parseInt(dateParts[1], 10);
        var day = parseInt(dateParts[2], 10);

        var dt = new Date(year, month - 1, day);
        var dName = d === 0 ? '今天' : daysMap[dt.getDay()];
        
        html += '<tr class="forecast-row">';
        html += '<td style="width: 28%; font-weight: 900;"><b>' + dName + '</b> <span style="font-size:18px; font-weight:900;">(' + month + '/' + day + ')</span></td>';
        html += '<td style="width: 38%; font-weight: 900;"><b>' + getWeatherText(daily.weather_code[d]) + '</b></td>';
        html += '<td style="width: 17%; font-weight: 900;"><b>降雨 ' + (daily.precipitation_probability_max[d]||0) + '%</b></td>';
        html += '<td style="width: 17%; text-align:right; font-weight: 900;"><b>' + Math.round(daily.temperature_2m_max[d]) + '° / ' + Math.round(daily.temperature_2m_min[d]) + '°C</b></td>';
        html += '</tr>';
      }
      document.getElementById('forecast-body').innerHTML = html;

      var londonDate = getTZDate(1);
      document.getElementById('update-time').innerText = padZero(londonDate.getHours()) + ':' + padZero(londonDate.getMinutes());
    }

    window.onload = function() {
      updateClock();
      setInterval(updateClock, 1000); // 時鐘每秒更新
      fetchWeather();
      setInterval(fetchWeather, 15 * 60 * 1000); // 天氣每 15 分鐘刷新
      fetchAllCalendars();
      setInterval(fetchAllCalendars, 15 * 60 * 1000); // 日曆每 15 分鐘刷新
    };
  </script>
</body>
</html>
