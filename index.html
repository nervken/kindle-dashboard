<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kindle Weather & Live GAS Calendar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    color: #000000;
    font-family: Arial, "Heiti TC", "Microsoft JhengHei", sans-serif;
    -webkit-text-size-adjust: none;
  }
  body {
    padding: 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .kindle-box {
    border: 4px solid #000000;
    padding: 8px;
    margin-bottom: 8px;
    width: 100%;
  }

  .time-large {
    font-size: 85px;
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: -3px;
  }

  table { width: 100%; border-collapse: collapse; }

  .data-table td {
    border: 2px solid #000000;
    padding: 8px 6px;
    font-size: 20px;
    font-weight: 900;
  }

  .forecast-table td {
    border-bottom: 2px solid #000000;
    padding: 8px 4px;
    font-size: 20px;
    font-weight: 900 !important;
  }

  .calendar-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .calendar-item {
    font-size: 21px;
    font-weight: 900;
    padding: 6px 0;
    border-bottom: 2px dashed #000000;
    word-break: break-all;
  }
  .calendar-item:last-child {
    border-bottom: none;
  }
</style>
</head>
<body>

  <!-- 1. 頂部頁眉：特大時間與地點 -->
  <div style="border-bottom: 5px solid #000000; padding-bottom: 6px; margin-bottom: 6px;">
    <table>
      <tr>
        <td style="vertical-align: bottom; width: 55%;">
          <div class="time-large" id="current-time">--:--</div>
          <div id="current-date" style="font-size: 24px; font-weight: 900; margin-top: 6px;">----年--月--日</div>
        </td>
        <td style="text-align: right; vertical-align: bottom; width: 45%;">
          <div style="border: 3px solid #000000; padding: 4px 8px; font-size: 20px; font-weight: 900; display: inline-block; margin-bottom: 4px;">
            [地點] <span id="location-name">英國 Denton</span>
          </div>
          <div>
            <span id="header-temp" style="font-size: 42px; font-weight: 900;">--°C</span>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <!-- 2. 今日天氣實況 -->
  <div class="kindle-box">
    <div style="font-size: 22px; font-weight: 900; border-bottom: 3px solid #000000; padding-bottom: 4px; margin-bottom: 6px;">
      今日天氣實況
    </div>
    
    <table style="margin-bottom: 6px;">
      <tr>
        <td style="font-size: 60px; font-weight: 900; width: 35%;" id="main-temp">--°C</td>
        <td style="text-align: right; font-size: 20px; font-weight: 900; width: 65%; line-height: 1.3;">
          <div id="main-condition-text" style="font-size: 24px; font-weight: 900; margin-bottom: 2px;">載入中...</div>
          <div>最高: <span id="temp-max">--</span> / 最低: <span id="temp-min">--</span></div>
          <div>體感溫度: <span id="apparent-temp">--</span></div>
        </td>
      </tr>
    </table>

    <table class="data-table">
      <tr>
        <td style="width: 50%;">降雨機率: <span id="rain-chance">--%</span></td>
        <td style="width: 50%;">相對濕度: <span id="humidity">--%</span></td>
      </tr>
      <tr>
        <td>風速: <span id="wind-speed">-- km/h</span></td>
        <td>預計日出: <span id="sun-time">--:--</span></td>
      </tr>
    </table>
  </div>

  <!-- 3. Google 日曆行程區塊 -->
  <div class="kindle-box">
    <div style="font-size: 22px; font-weight: 900; border-bottom: 3px solid #000000; padding-bottom: 4px; margin-bottom: 6px;">
      📅 Google 日曆近期預約行程 (未來 5 天內)
    </div>
    <ul class="calendar-list" id="calendar-events-list">
      <li class="calendar-item" id="cal-status">正在同步讀取 Google 日曆行程...</li>
    </ul>
  </div>

  <!-- 4. 未來 7 天天氣預報 -->
  <div class="kindle-box" style="flex: 1;">
    <div style="font-size: 22px; font-weight: 900; border-bottom: 3px solid #000000; padding-bottom: 4px; margin-bottom: 6px;">
      未來 7 天天氣預報
    </div>
    <table class="forecast-table">
      <tbody id="forecast-body">
        <tr><td style="text-align:center; padding: 10px 0; font-size: 20px; font-weight: 900;" id="status-msg">正在更新天氣數據...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 5. 世界城市時間 -->
  <div class="kindle-box" style="margin-bottom: 0;">
    <div style="font-size: 18px; font-weight: 900; border-bottom: 2px solid #000000; margin-bottom: 4px; padding-bottom: 2px;">
      世界主要城市時間
    </div>
    <table style="text-align: center; font-size: 18px; font-weight: 900;">
      <tr style="font-size: 16px; color: #000;">
        <td style="width: 20%;">倫敦</td>
        <td style="width: 20%;">香港</td>
        <td style="width: 20%;">紐約</td>
        <td style="width: 20%;">東京</td>
        <td style="width: 20%;">雪梨</td>
      </tr>
      <tr style="font-size: 22px; font-weight: 900; height: 30px; vertical-align: middle;">
        <td id="clock-london">--:--</td>
        <td id="clock-hk">--:--</td>
        <td id="clock-ny">--:--</td>
        <td id="clock-tokyo">--:--</td>
        <td id="clock-sydney">--:--</td>
      </tr>
    </table>
  </div>

  <div style="font-size: 12px; font-weight: 900; margin-top: 4px; text-align: right;">
    最後更新時間: <span id="update-time">--:--</span>
  </div>

  <script>
    var lat = 53.456, lon = -2.115; // Denton, UK
    
    // 你的 GAS 專屬網址
    var gasUrl = 'https://script.google.com/macros/s/AKfycbznwqGGC7sr-a6XSgsUdXye6V-qyBxcTbBMLESGS7YlTCwD1Kpmma-Y6wtWFbpQL9R_bg/exec';

    function padZero(num) { return num < 10 ? '0' + num : '' + num; }

    function parseTimeString(isoStr) {
      if (!isoStr) return '--:--';
      if (isoStr.indexOf('T') !== -1) {
        return isoStr.split('T')[1].substring(0, 5);
      }
      return isoStr;
    }

    function getTZDate(offsetHours) {
      var d = new Date();
      var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      return new Date(utc + (3600000 * offsetHours));
    }

    function calcTZTime(offsetHours) {
      var nd = getTZDate(offsetHours);
      return padZero(nd.getHours()) + ':' + padZero(nd.getMinutes());
    }

    function updateClock() {
      var londonDate = getTZDate(1);
      var h = padZero(londonDate.getHours());
      var m = padZero(londonDate.getMinutes());
      document.getElementById('current-time').innerText = h + ':' + m;

      var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('current-date').innerText = londonDate.getFullYear() + '年' + (londonDate.getMonth()+1) + '月' + londonDate.getDate() + '日 ' + days[londonDate.getDay()];

      document.getElementById('clock-london').innerText = h + ':' + m;
      document.getElementById('clock-hk').innerText = calcTZTime(8);
      document.getElementById('clock-ny').innerText = calcTZTime(-4);
      document.getElementById('clock-tokyo').innerText = calcTZTime(9);
      document.getElementById('clock-sydney').innerText = calcTZTime(10);
    }

    window.onCalendarDataLoaded = function(data) {
      var eventsList = data.events ? data.events : data;
      renderCalendarEvents(eventsList);
    };
    
    function fetchAllCalendars() {
      // 移除舊的 script 標籤 (若存在)
      var oldScript = document.getElementById('gas-jsonp-script');
      if (oldScript) {
        oldScript.parentNode.removeChild(oldScript);
      }
    
      // 建立新的 script 標籤發送 JSONP 請求
      var script = document.createElement('script');
      script.id = 'gas-jsonp-script';
      
      var fetchUrl = gasUrl + (gasUrl.indexOf('?') !== -1 ? '&' : '?') + 
                     'callback=onCalendarDataLoaded&_t=' + new Date().getTime();
      
      script.src = fetchUrl;
      script.onerror = function() {
        document.getElementById('calendar-events-list').innerHTML = '<li class="calendar-item">• 載入日曆失敗 (Script Error)</li>';
      };
    
      document.body.appendChild(script);
    }
    
      // 增加錯誤捕捉處理
      xhr.onerror = function() {
        // 嘗試從 responseText 強制解析
        if (xhr.responseText) {
          try {
            var response = JSON.parse(xhr.responseText);
            var eventsList = response.events ? response.events : response;
            renderCalendarEvents(eventsList);
            return;
          } catch(e) {}
        }
        document.getElementById('calendar-events-list').innerHTML = '<li class="calendar-item">• 網路連線或 CORS 限制失敗</li>';
      };
    
      xhr.send();
    }

    function renderCalendarEvents(events) {
      if (!events || events.length === 0) {
        document.getElementById('calendar-events-list').innerHTML = '<li class="calendar-item">• 未來 5 天內沒有預約行程</li>';
        return;
      }
    
      var londonDate = getTZDate(1);
      var todayDay = londonDate.getDate();
    
      var html = '';
      // 顯示最多 8 筆，防止內容溢出電子紙框線
      for (var i = 0; i < events.length && i < 8; i++) {
        var ev = events[i];
        var isToday = (ev.day === todayDay);
        var prefix = isToday ? '[今日] ' : '';
    
        var dateStr = prefix + ev.month + '/' + ev.day + ' ';
        if (ev.isTime && ev.timeStr) {
          dateStr += ev.timeStr + ' ';
        } else {
          dateStr += '(全天) ';
        }
    
        // 區分 Task 與 Event 的顯示標示
        var typeTag = (ev.type === 'task') ? '📌 ' : '🗓️ ';
    
        html += '<li class="calendar-item">• ' + typeTag + dateStr + (ev.summary || '未命名行程') + '</li>';
      }
    
      document.getElementById('calendar-events-list').innerHTML = html;
    }

    function getWeatherText(code) {
      if (code === 0) return '[晴] 陽光普照';
      if (code === 1) return '[晴] 大致天晴';
      if (code === 2) return '[雲] 晴間多雲';
      if (code === 3) return '[雲] 密雲有陰';
      if (code === 45 || code === 48) return '[霧] 局地有霧';
      if (code >= 51 && code <= 55) return '[雨] 輕微毛毛雨';
      if (code >= 61 && code <= 63) return '[雨] 局部有陣雨';
      if (code === 65) return '[雨] 中至大陣雨';
      if (code >= 71 && code <= 77) return '[雪] 飄雪或積雪';
      if (code >= 80 && code <= 82) return '[雨] 短暫局部雨';
      if (code >= 95) return '[雷] 雷暴及陣雨';
      return '[陰] 多雲有陰';
    }

    function fetchWeather() {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max&timezone=auto';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            renderWeather(data);
          } catch(e) {}
        }
      };
      xhr.send();
    }

    function renderWeather(data) {
      var cur = data.current;
      var daily = data.daily;

      document.getElementById('header-temp').innerText = Math.round(cur.temperature_2m) + '°C';
      document.getElementById('main-temp').innerText = Math.round(cur.temperature_2m) + '°C';
      
      var condText = getWeatherText(cur.weather_code);
      document.getElementById('main-condition-text').innerText = condText;

      document.getElementById('temp-max').innerText = Math.round(daily.temperature_2m_max[0]) + '°C';
      document.getElementById('temp-min').innerText = Math.round(daily.temperature_2m_min[0]) + '°C';
      document.getElementById('apparent-temp').innerText = Math.round(cur.apparent_temperature) + '°C';

      document.getElementById('rain-chance').innerText = (daily.precipitation_probability_max[0] || 0) + '%';
      document.getElementById('humidity').innerText = cur.relative_humidity_2m + '%';
      document.getElementById('wind-speed').innerText = Math.round(cur.wind_speed_10m) + 'km/h';

      if (daily.sunrise && daily.sunrise[0]) {
        document.getElementById('sun-time').innerText = parseTimeString(daily.sunrise[0]);
      }

      var html = '';
      var daysMap = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      for (var d = 0; d < 7 && d < daily.time.length; d++) {
        var dateParts = daily.time[d].split('-');
        var year = parseInt(dateParts[0], 10);
        var month = parseInt(dateParts[1], 10);
        var day = parseInt(dateParts[2], 10);

        var dt = new Date(year, month - 1, day);
        var dName = d === 0 ? '今天' : daysMap[dt.getDay()];
        
        html += '<tr class="forecast-row">';
        html += '<td style="width: 28%; font-weight: 900;"><b>' + dName + '</b> <span style="font-size:18px; font-weight:900;">(' + month + '/' + day + ')</span></td>';
        html += '<td style="width: 38%; font-weight: 900;"><b>' + getWeatherText(daily.weather_code[d]) + '</b></td>';
        html += '<td style="width: 17%; font-weight: 900;"><b>降雨 ' + (daily.precipitation_probability_max[d]||0) + '%</b></td>';
        html += '<td style="width: 17%; text-align:right; font-weight: 900;"><b>' + Math.round(daily.temperature_2m_max[d]) + '° / ' + Math.round(daily.temperature_2m_min[d]) + '°C</b></td>';
        html += '</tr>';
      }
      document.getElementById('forecast-body').innerHTML = html;

      var londonDate = getTZDate(1);
      document.getElementById('update-time').innerText = padZero(londonDate.getHours()) + ':' + padZero(londonDate.getMinutes());
    }

    window.onload = function() {
      updateClock();
      setInterval(updateClock, 1000);
      fetchWeather();
      setInterval(fetchWeather, 15 * 60 * 1000);
      fetchAllCalendars();
      setInterval(fetchAllCalendars, 15 * 60 * 1000);
    };
  </script>
</body>
</html>
